name: Frozen iOS unsigned Release archive
on:
  push:
    branches: [codex/commandeici-ios-frozen-release-20261005]
    paths: ['.github/workflows/ios-frozen-release.yml']
permissions:
  contents: read
jobs:
  unsigned-release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: c5e10d810d401fe60c1bb642c58b54c5eead5c68
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
          cache: npm
      - name: Restore locked dependencies
        run: npm ci
      - name: Validate published public client configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_REVENUECAT_IOS_API_KEY: ${{ vars.VITE_REVENUECAT_IOS_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/CIRelease/config"
          cd "$RUNNER_TEMP/CIRelease/config"
          python3 "$GITHUB_WORKSPACE/scripts/ci-public-ios-config.py"
      - name: Build public iOS resources
        run: npm run ios:sync
      - name: Archive the exact unsigned Release for local signing
        run: |
          mkdir -p "$RUNNER_TEMP/CIRelease"
          git rev-parse HEAD > "$RUNNER_TEMP/CIRelease/source.txt"
          git diff --exit-code
          test -z "$(git status --porcelain)"
          xcodebuild -version > "$RUNNER_TEMP/CIRelease/xcode.txt"
          test "$(xcodebuild -version)" = "$(printf 'Xcode 26.2\nBuild version 17C52')"
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release             -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/CommandeIciReleaseData"             -archivePath "$RUNNER_TEMP/CIRelease/CommandeIci-1.0-7.xcarchive" CODE_SIGNING_ALLOWED=NO archive             2>&1 | tee "$RUNNER_TEMP/CIRelease/archive.log"
          python3 - <<'RELEASE'
          from pathlib import Path
          import json,hashlib,plistlib,subprocess,os
          report=Path(os.environ['RUNNER_TEMP'])/'CIRelease'
          app=report/'CommandeIci-1.0-7.xcarchive/Products/Applications/App.app'
          info=plistlib.loads((app/'Info.plist').read_bytes())
          assert info['CFBundleIdentifier']=='com.commandeici.app' and info['CFBundleVersion']=='7' and info['CFBundleShortVersionString']=='1.0'
          files=[]
          for f in sorted(Path('dist').rglob('*')):
              if f.is_file():
                  name=f.relative_to('dist').as_posix()
                  assert f.read_bytes()==(app/'public'/name).read_bytes(), name
                  files.append({'path':name,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
          assert files
          (report/'runtime.json').write_text(json.dumps(files,indent=2))
          (report/'unsigned-archive.json').write_text(json.dumps({'source':(report/'source.txt').read_text().strip(),'version':'1.0','build':'7','bundle':'com.commandeici.app','unsigned':True,'privateSigningMaterialProvidedToCI':False,'runtimeFileCount':len(files),'executableSHA256':hashlib.sha256((app/'App').read_bytes()).hexdigest()},indent=2))
          subprocess.run(['ditto','-c','-k','--keepParent',str(report/'CommandeIci-1.0-7.xcarchive'),str(report/'unsigned-release.zip')],check=True)
          RELEASE
      - name: Preserve unsigned archive and full build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commandeici-unsigned-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/CIRelease/source.txt
            ${{ runner.temp }}/CIRelease/xcode.txt
            ${{ runner.temp }}/CIRelease/archive.log
            ${{ runner.temp }}/CIRelease/runtime.json
            ${{ runner.temp }}/CIRelease/unsigned-archive.json
            ${{ runner.temp }}/CIRelease/unsigned-release.zip
          retention-days: 1
