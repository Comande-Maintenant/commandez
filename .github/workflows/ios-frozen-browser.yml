name: Focused account-menu Escape verification
on:
  push:
    branches: [codex/commandeici-ios-frozen-browser-20261005]
    paths: ['.github/workflows/ios-frozen-browser.yml']
permissions:
  contents: read
concurrency:
  group: frozen-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-integration:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: c5e10d810d401fe60c1bb642c58b54c5eead5c68
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
          cache: npm
      - name: Restore locked dependencies and browser tools
        run: |
          npm ci
          npx playwright install webkit
          if [ ! -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ]; then
            npx playwright install chrome
          fi
      - name: Validate published public client configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_REVENUECAT_IOS_API_KEY: ${{ vars.VITE_REVENUECAT_IOS_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/CIWeb/config"
          cd "$RUNNER_TEMP/CIWeb/config"
          python3 "$GITHUB_WORKSPACE/scripts/ci-public-ios-config.py"
      - name: Execute all 63 account-menu cases once on all three engines
        run: |
          mkdir -p "$RUNNER_TEMP/CIWeb"
          git rev-parse HEAD > "$RUNNER_TEMP/CIWeb/source.txt"
          git diff --exit-code
          npx playwright --version > "$RUNNER_TEMP/CIWeb/playwright.txt"
          '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --version > "$RUNNER_TEMP/CIWeb/chrome.txt"
          python3 - <<'BROWSER'
          from pathlib import Path
          import os, subprocess, time, urllib.request, signal
          env=dict(os.environ, PLAYWRIGHT_BASE_URL='http://127.0.0.1:4391')
          report=Path(os.environ['RUNNER_TEMP'])/'CIWeb'
          with (report/'vite.log').open('w') as log:
              server=subprocess.Popen(['node','node_modules/vite/bin/vite.js','--host','127.0.0.1','--port','4391','--strictPort'],env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
              try:
                  deadline=time.monotonic()+20
                  while True:
                      assert server.poll() is None, 'Owned Vite server exited before readiness'
                      try:
                          with urllib.request.urlopen(env['PLAYWRIGHT_BASE_URL'],timeout=2) as response:
                              if response.status==200: break
                      except OSError:
                          pass
                      assert time.monotonic()<deadline, 'Owned local Vite server did not become ready'
                      time.sleep(0.2)
                  import runpy,sys,json
                  sys.dont_write_bytecode=True
                  helpers=runpy.run_path('scripts/run-e2e-isolated.py')
                  env['PLAYWRIGHT_JSON_OUTPUT_FILE']=str(report/'focused-collection.json')
                  with (report/'collection.log').open('w') as listing:
                      subprocess.run(['npx','playwright','test','menu-contrast.spec.ts','--list','--reporter=json'],env=env,stdout=listing,stderr=subprocess.STDOUT,check=True)
                  collection=json.loads((report/'focused-collection.json').read_text())
                  expected=helpers['identities'](collection)
                  assert len(expected)==63 and len(set(expected))==63
                  env['PLAYWRIGHT_JSON_OUTPUT_FILE']=str(report/'focused-results.json')
                  with (report/'focused.log').open('w') as output:
                      result=subprocess.run(['npx','playwright','test','menu-contrast.spec.ts','--workers=1','--retries=0','--reporter=list,json','--output='+str(report/'focused-results')],env=env,stdout=output,stderr=subprocess.STDOUT)
                  actual=json.loads((report/'focused-results.json').read_text())
                  identities=helpers['identities'](actual)
                  proof={'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'focusedOnlyNotFull426':True,'collected':len(expected),'executed':len(identities),'allUniqueAndExactlyOnce':len(identities)==len(set(identities)) and sorted(expected)==sorted(identities),'allSinglePassNoRetry':helpers['results_are_single_passes'](actual),'stats':actual['stats'],'actualExitCode':result.returncode}
                  (report/'focused-summary.json').write_text(json.dumps(proof,indent=2))
                  assert not subprocess.check_output(['git','status','--porcelain'],text=True)
                  assert result.returncode==0 and proof['allUniqueAndExactlyOnce'] and proof['allSinglePassNoRetry'] and proof['stats']['expected']==63 and not any(proof['stats'][key] for key in ['unexpected','skipped','flaky']), 'Focused menu case failed; preserve all raw results'
              finally:
                  if server.poll() is None:
                      os.killpg(server.pid,signal.SIGTERM)
                      try: server.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          os.killpg(server.pid,signal.SIGKILL);server.wait(timeout=5)
          BROWSER
      - name: Preserve all raw browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commandeici-browser-${{ github.sha }}
          path: ${{ runner.temp }}/CIWeb
          retention-days: 1
