name: Frozen iOS browser integration
on:
  push:
    branches: [codex/commandeici-ios-frozen-browser-20261005]
    paths: ['.github/workflows/ios-frozen-browser.yml']
permissions:
  contents: read
concurrency:
  group: frozen-browser-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser-integration:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: b57f0a148c5acce658e154a820e4921f506a39f1
          fetch-depth: 3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.13.0
          cache: npm
      - name: Restore locked dependencies and browser tools
        run: |
          npm ci
          npx playwright install webkit
          if [ ! -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' ]; then
            npx playwright install chrome
          fi
      - name: Validate published public client configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_REVENUECAT_IOS_API_KEY: ${{ vars.VITE_REVENUECAT_IOS_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/CIBrowser/config"
          cd "$RUNNER_TEMP/CIBrowser/config"
          python3 "$GITHUB_WORKSPACE/scripts/ci-public-ios-config.py"
      - name: Verify exact app and test source equivalence
        run: |
          python3 - <<'PROOF'
          from pathlib import Path
          import subprocess,json,hashlib,os
          out=Path(os.environ['RUNNER_TEMP'])/'CIBrowser'
          app='11f552440ce8553de555a313947b7b64da8ac35f'
          qa='b57f0a148c5acce658e154a820e4921f506a39f1'
          allowed=['e2e/stock-navigation.spec.ts','e2e/ui-readability.spec.ts']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==qa
          assert subprocess.check_output(['git','diff','--name-only',app,qa],text=True).splitlines()==allowed
          assert not subprocess.check_output(['git','status','--porcelain'],text=True)
          def tree(ref):
              return [x for x in subprocess.check_output(['git','ls-tree','-r',ref],text=True).splitlines() if x.split('\t')[1] not in allowed]
          original=tree(app);current=tree(qa);assert original==current and len(current)==641
          digest=hashlib.sha256(('\n'.join(current)+'\n').encode()).hexdigest()
          assert digest=='ebbe49d3e18a31a7c162cc71876b19c83a788bcf999018b3b71b71337d7169f6'
          testhashes={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in allowed}
          assert testhashes=={'e2e/stock-navigation.spec.ts':'b05930210eddfca5386c488f808360a65524975688cbc9922edc3760b76516a4','e2e/ui-readability.spec.ts':'5335d86c1f8ec01007cfd4c08621964fdc4b0fd943b13a989a3a4dea2ffa7125'}
          (out/'source.txt').write_text(qa+'\n');(out/'app-source.txt').write_text(app+'\n')
          (out/'source-equivalence.json').write_text(json.dumps({'appSource':app,'qaCommit':qa,'changedPaths':allowed,'allOtherTrackedFilesByteIdentical':True,'unchangedTrackedEntries':641,'unchangedTreeSHA256':digest,'testFileSHA256':testhashes},indent=2))
          PROOF
      - name: Execute all 495 collected scenarios once on all three engines
        run: |
          npx playwright --version > "$RUNNER_TEMP/CIBrowser/playwright.txt"
          '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --version > "$RUNNER_TEMP/CIBrowser/chrome.txt"
          python3 - <<'BROWSER'
          from pathlib import Path
          import os,subprocess,time,urllib.request,signal,json,socket
          out=Path(os.environ['RUNNER_TEMP'])/'CIBrowser'
          port=int(os.environ.get('CI_BROWSER_PORT','4391'))
          assert 1024<=port<=65535
          with socket.socket() as probe:
              probe.bind(('127.0.0.1',port))
          env=dict(os.environ,PLAYWRIGHT_BASE_URL=f'http://127.0.0.1:{port}')
          with (out/'vite.log').open('w') as log:
              server=subprocess.Popen(['node','node_modules/vite/bin/vite.js','--host','127.0.0.1','--port',str(port),'--strictPort'],env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
              try:
                  deadline=time.monotonic()+20
                  while True:
                      assert server.poll() is None, 'Owned Vite server exited before readiness'
                      try:
                          with urllib.request.urlopen(env['PLAYWRIGHT_BASE_URL'],timeout=2) as response:
                              if response.status==200:
                                  assert server.poll() is None, 'Owned Vite server exited during readiness'
                                  break
                      except OSError:pass
                      assert time.monotonic()<deadline, 'Owned Vite server did not become ready'
                      time.sleep(.2)
                  result=subprocess.run(['python3','scripts/run-e2e-isolated.py',str(out/'integration')],env=env)
                  report=json.loads((out/'integration'/'report.json').read_text())
                  assert report['source']=='b57f0a148c5acce658e154a820e4921f506a39f1'
                  assert report['collected']==report['executed']==report['stats']['expected']==495
                  assert report['allCollectedCasesExecutedExactlyOnce'] and report['allActualResultsSinglePassedWithoutRetry']
                  assert not any(report['stats'][key] for key in ['unexpected','skipped','flaky']) and report['retries']==0
                  assert result.returncode==0 and not subprocess.check_output(['git','status','--porcelain'],text=True)
              finally:
                  if server.poll() is None:
                      os.killpg(server.pid,signal.SIGTERM)
                      try:server.wait(timeout=5)
                      except subprocess.TimeoutExpired:os.killpg(server.pid,signal.SIGKILL);server.wait(timeout=5)
          BROWSER
      - name: Preserve all raw browser integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: commandeici-browser495-${{ github.sha }}
          path: ${{ runner.temp }}/CIBrowser
          retention-days: 7
