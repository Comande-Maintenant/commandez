      - name: Create isolated simulator
        timeout-minutes: 8
        run: |
          CI_SIM_ID=$(xcrun simctl create "CommandeIci CI ${GITHUB_RUN_ID}" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-26-2)
          echo "CI_SIM_ID=$CI_SIM_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$CI_SIM_ID"
          set -o pipefail
          xcrun simctl bootstatus "$CI_SIM_ID" -b 2>&1 | tee CIReport/simulator-boot.log
          echo "CI_SIM_BOOT_READY=true" >> "$GITHUB_ENV"
      - name: Build simulator with local signing and simulated entitlements
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "platform=iOS Simulator,id=$CI_SIM_ID" -derivedDataPath "$RUNNER_TEMP/CommandeIciDerivedData" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=889YAF54QV \
            build-for-testing 2>&1 | tee CIReport/native-build.log
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,os,plistlib,subprocess
          derived=Path(os.environ['RUNNER_TEMP'])/'CommandeIciDerivedData'
          app=derived/'Build/Products/Debug-iphonesimulator/App.app'
          ent=derived/'Build/Intermediates.noindex/App.build/Debug-iphonesimulator/App.build/App.app-Simulated.xcent'
          attributes=plistlib.loads(ent.read_bytes())
          assert attributes['application-identifier']=='889YAF54QV.com.commandeici.app', 'Simulator secure storage requires its application identifier'
          subprocess.run(['codesign','--verify','--deep','--strict',str(app)],check=True,capture_output=True)
          Path('CIReport/simulator-signing.json').write_text(json.dumps({'localAdHocOnly':True,'privateCertificateUsed':False,'simulatedApplicationIdentifier':attributes['application-identifier'],'signatureVerified':True},indent=2))
          PYCODE
