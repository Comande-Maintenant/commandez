name: iOS native UI verification

on:
  push:
    branches: [codex/commandeici-ios-notification-diagnostic-20261005]
    paths:
      - '.github/workflows/ios-native-ui.yml'
      - 'scripts/ci-public-ios-config.py'
      - 'scripts/test-ci-public-ios-config.py'
      - 'scripts/ci-public-ios-readiness.py'
      - 'scripts/test-ci-public-ios-readiness.py'
      - 'scripts/ci-cold-webkit-reference.py'
      - 'scripts/native-cold-reference.swift'
      - 'src/**'
      - 'ios/**'
      - 'public/**'
      - 'package*.json'
      - 'capacitor.config.ts'
  workflow_dispatch:
    inputs:
      cold_reference:
        description: 'Also observe the separate diagnostic WebKit reference (never warms the app)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-native-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold-reference:
    if: github.event_name == 'workflow_dispatch' && inputs.cold_reference
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Observe WebKit on a separate fresh host
        run: |
          test "$(xcodebuild -version)" = "$(printf 'Xcode 26.2\nBuild version 17C52')"
          python3 scripts/ci-cold-webkit-reference.py
      - name: Preserve separate reference evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commandeici-cold-reference-${{ github.sha }}
          path: CIReference
          retention-days: 1
  native-ui:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: c5e10d810d401fe60c1bb642c58b54c5eead5c68
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
          cache: npm
      - name: Verify native opening recovery policy
        run: ios/PolicyTests/run.sh
      - name: Restore locked dependencies
        run: npm ci
      - name: Check public configuration rejection rules
        run: python3 scripts/test-ci-public-ios-config.py
      - name: Validate published public client configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_REVENUECAT_IOS_API_KEY: ${{ vars.VITE_REVENUECAT_IOS_API_KEY }}
        run: python3 scripts/ci-public-ios-config.py
      - name: Check public readiness rejection rules
        run: python3 scripts/test-ci-public-ios-readiness.py
      - name: Check anonymous public demo readiness
        run: python3 scripts/ci-public-ios-readiness.py
      - name: Build and sync iOS resources
        run: npm run ios:sync
      - name: Record exact source, runtime and tools
        run: |
          mkdir -p CIReport
          git rev-parse HEAD > CIReport/source.txt
          git diff --exit-code
          xcodebuild -version > CIReport/xcode.txt
          test "$(xcodebuild -version)" = "$(printf 'Xcode 26.2\nBuild version 17C52')"
          sw_vers > CIReport/macos.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          files=[]
          for file in sorted((root/'dist').rglob('*')):
            if file.is_file():
              relative=file.relative_to(root/'dist').as_posix()
              assert file.read_bytes()==(root/'ios/App/App/public'/relative).read_bytes(),relative
              files.append({'path':relative,'sha256':hashlib.sha256(file.read_bytes()).hexdigest()})
          assert files
          Path('CIReport/runtime.json').write_text(json.dumps(files,indent=2))
          PY
      - name: Verify integrated native QA source without patches
        run: |
          python3 - <<'QA_SOURCE'
          from pathlib import Path
          import hashlib,json,subprocess,os
          target=Path('ios/App/CommandeIciUITests/CommandeIciUITests.swift')
          sha=hashlib.sha256(target.read_bytes()).hexdigest()
          assert sha=='1e4734b3c84ba211cf41955cee61b7f35fb605cbcb87919e8298e8f2921b95f7'
          appSource=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert appSource=='c5e10d810d401fe60c1bb642c58b54c5eead5c68'
          subprocess.run(['git','diff','--exit-code'],check=True)
          # CIReport contains only the owned outputs created by preceding steps.
          assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=all','--','.',':(exclude)CIReport'],text=True).strip()
          Path('CIReport/qa-source.json').write_text(json.dumps({'appSource':appSource,'qaPath':str(target),'qaSHA256':sha,'workflowCommit':os.environ['GITHUB_SHA'],'allTrackedFilesUnchanged':True,'noInstrumentation':True,'integratedModalAcknowledgement':True},indent=2))
          QA_SOURCE
      - name: Apply reviewed DEBUG-only post-deadline diagnostic observers and companion
        run: |
          python3 - <<'AFTER_DEADLINE'
          from pathlib import Path
          import json,hashlib,subprocess
          target=Path('ios/App/App/AppDelegate.swift')
          assert hashlib.sha256(target.read_bytes()).hexdigest()=='f2ea9e63a9c0f9f4b54eea7c0e73e215f2ace39fcfa317d11c39b0e74be772d2'
          target.write_text('import UIKit\nimport Capacitor\n\n@UIApplicationMain\nclass AppDelegate: UIResponder, UIApplicationDelegate {\n\n    var window: UIWindow?\n\n    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {\n        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)\n    }\n\n    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {\n        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)\n    }\n\n    func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {\n        #if DEBUG\n        NotificationDiagnostic.start()\n        #endif\n        // Override point for customization after application launch.\n        return true\n    }\n\n    func applicationWillResignActive(_ application: UIApplication) {\n        // Sent when the application is about to move from active to inactive state. This can occur for certain types of temporary interruptions (such as an incoming phone call or SMS message) or when the user quits the application and it begins the transition to the background state.\n        // Use this method to pause ongoing tasks, disable timers, and invalidate graphics rendering callbacks. Games should use this method to pause the game.\n    }\n\n    func applicationDidEnterBackground(_ application: UIApplication) {\n        #if DEBUG\n        NotificationDiagnostic.sample("background")\n        #endif\n        // Use this method to release shared resources, save user data, invalidate timers, and store enough application state information to restore your application to its current state in case it is terminated later.\n        // If your application supports background execution, this method is called instead of applicationWillTerminate: when the user quits.\n    }\n\n    func applicationWillEnterForeground(_ application: UIApplication) {\n        // Called as part of the transition from the background to the active state; here you can undo many of the changes made on entering the background.\n    }\n\n    func applicationDidBecomeActive(_ application: UIApplication) {\n        // Restart any tasks that were paused (or not yet started) while the application was inactive. If the application was previously in the background, optionally refresh the user interface.\n    }\n\n    func applicationWillTerminate(_ application: UIApplication) {\n        // Called when the application is about to terminate. Save data if appropriate. See also applicationDidEnterBackground:.\n    }\n\n    func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {\n        // Called when the app was launched with a url. Feel free to add additional processing here,\n        // but if you want the App API to support tracking app url opens, make sure to keep this call\n        return ApplicationDelegateProxy.shared.application(app, open: url, options: options)\n    }\n\n    func application(_ application: UIApplication, continue userActivity: NSUserActivity, restorationHandler: @escaping ([UIUserActivityRestoring]?) -> Void) -> Bool {\n        // Called when the app was launched with an activity, including Universal Links.\n        // Feel free to add additional processing here, but if you want the App API to support\n        // tracking app url opens, make sure to keep this call\n        return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)\n    }\n\n}\n\n#if DEBUG\nimport UserNotifications\n\n// CI-only known-fixture metadata; no timers, permissions, scheduling or delegate changes.\nprivate enum NotificationDiagnostic {\n    private static let lock = NSLock()\n    private static var observations: [NSObjectProtocol] = []\n    static func start() {\n        guard ProcessInfo.processInfo.environment["COMMANDEICI_QA_DEMO"] == "1" else { return }\n        observations.append(NotificationCenter.default.addObserver(forName: Notification.Name("CommandeIciQaNotificationAddResult"), object: nil, queue: nil) { notification in\n            guard let failed = notification.userInfo?["failed"] as? Bool else { return }\n            DispatchQueue.main.async { sample("native-add-completed", addFailed: failed) }\n        })\n        observations.append(NotificationCenter.default.addObserver(forName: UIApplication.didBecomeActiveNotification, object: nil, queue: .main) { _ in sample("became-active") })\n        sample("launch")\n    }\n    static func sample(_ boundary: String, addFailed: Bool? = nil) {\n        guard ProcessInfo.processInfo.environment["COMMANDEICI_QA_DEMO"] == "1" else { return }\n        let appState = UIApplication.shared.applicationState.rawValue\n        let center = UNUserNotificationCenter.current()\n        let delegatePresent = center.delegate != nil\n        center.getNotificationSettings { settings in\n            center.getPendingNotificationRequests { requests in\n                center.getDeliveredNotifications { delivered in\n                    let pending = requests.filter { $0.identifier == "1701003" }.map { request -> [String: Any] in\n                        let trigger = request.trigger\n                        return ["interval": (trigger as? UNTimeIntervalNotificationTrigger)?.timeInterval ?? -1,\n                                "repeats": trigger?.repeats ?? false,\n                                "expectedTitle": request.content.title == "CommandeIci · Démonstration",\n                                "expectedBody": request.content.body == "Nouvelle commande fictive. Ouvrez la démo pour la préparer."]\n                    }\n                    var entry: [String: Any] = ["boundary": boundary, "utc": ISO8601DateFormatter().string(from: Date()),\n                        "uptime": ProcessInfo.processInfo.systemUptime, "appStateAtBoundary": appState,\n                        "delegatePresent": delegatePresent,\n                        "postFailureRead": ProcessInfo.processInfo.environment["COMMANDEICI_QA_POST_FAILURE"] == "1",\n                        "authorization": settings.authorizationStatus.rawValue,\n                        "alert": settings.alertSetting.rawValue, "alertStyle": settings.alertStyle.rawValue,\n                        "sound": settings.soundSetting.rawValue, "lockScreen": settings.lockScreenSetting.rawValue,\n                        "notificationCenter": settings.notificationCenterSetting.rawValue,\n                        "pending": pending, "deliveredDemoCount": delivered.filter { $0.request.identifier == "1701003" }.count]\n                    if let addFailed { entry["nativeAddFailed"] = addFailed }\n                    guard let directory = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first,\n                          var bytes = try? JSONSerialization.data(withJSONObject: entry) else { return }\n                    bytes.append(10)\n                    lock.lock()\n                    defer { lock.unlock() }\n                    let file = directory.appendingPathComponent("native-notification-diagnostic.ndjson")\n                    if !FileManager.default.fileExists(atPath: file.path) { FileManager.default.createFile(atPath: file.path, contents: nil) }\n                    guard let handle = try? FileHandle(forWritingTo: file) else { return }\n                    defer { try? handle.close() }\n                    do { try handle.seekToEnd(); try handle.write(contentsOf: bytes) } catch {}\n                }\n            }\n        }\n    }\n}\n#endif\n')
          assert hashlib.sha256(target.read_bytes()).hexdigest()=='ed1fa0918432ada8dbb4e1a9da11cd0e36b39ea4019004e8d8ae597e5812d8e6'
          target=Path('node_modules/@capacitor/local-notifications/ios/Sources/LocalNotificationsPlugin/LocalNotificationsPlugin.swift')
          assert hashlib.sha256(target.read_bytes()).hexdigest()=='d923157a6e8522dab046c43b773b4a2b149d19ff98902e9caf40778e83a7d2d4'
          target.write_text('import Foundation\nimport Capacitor\nimport UserNotifications\n\nenum LocalNotificationError: LocalizedError {\n    case contentNoId\n    case contentNoTitle\n    case contentNoBody\n    case triggerConstructionFailed\n    case triggerRepeatIntervalTooShort\n    case attachmentNoId\n    case attachmentNoUrl\n    case attachmentFileNotFound(path: String)\n    case attachmentUnableToCreate(String)\n\n    var errorDescription: String? {\n        switch self {\n        case .attachmentFileNotFound(path: let path):\n            return "Unable to find file \\(path) for attachment"\n        default:\n            return ""\n        }\n    }\n}\n\n/// OutSystems structured error codes (`OS-PLUG-LNOT-NNNN`) used for every\n/// `call.reject` in this plugin so both the Capacitor and Cordova plugins share\n/// an identical error contract.\nenum LocalNotificationsError: Error {\n    case invalidNotificationsArray\n    case missingIdentifier\n    case contentBuildFailed\n    case triggerBuildFailed\n    case notificationsDisabled\n    case invalidColor\n    case invalidRemoveList\n    case missingIds\n    case scheduleFailed\n    case permissionRequestFailed\n\n    var code: String {\n        switch self {\n        case .invalidNotificationsArray: return "OS-PLUG-LNOT-0001"\n        case .missingIdentifier: return "OS-PLUG-LNOT-0002"\n        case .contentBuildFailed: return "OS-PLUG-LNOT-0003"\n        case .triggerBuildFailed: return "OS-PLUG-LNOT-0004"\n        case .notificationsDisabled: return "OS-PLUG-LNOT-0005"\n        case .invalidColor: return "OS-PLUG-LNOT-0006"\n        case .invalidRemoveList: return "OS-PLUG-LNOT-0011"\n        case .missingIds: return "OS-PLUG-LNOT-0012"\n        case .scheduleFailed: return "OS-PLUG-LNOT-0010"\n        case .permissionRequestFailed: return "OS-PLUG-LNOT-0013"\n        }\n    }\n\n    var message: String {\n        switch self {\n        case .invalidNotificationsArray: return "Must provide a notifications array as the notifications option."\n        case .missingIdentifier: return "Notification is missing an identifier."\n        case .contentBuildFailed: return "Unable to build the notification content."\n        case .triggerBuildFailed: return "Unable to create the notification, trigger construction failed."\n        case .notificationsDisabled: return "Notifications are not enabled on this device."\n        case .invalidColor: return "Invalid color provided. Must be a hex string (e.g. #ff0000)."\n        case .invalidRemoveList: return "Expected notifications to be a list of notification objects."\n        case .missingIds: return "Must provide an ids array."\n        case .scheduleFailed: return "Unable to schedule the notification."\n        case .permissionRequestFailed: return "Unable to request notification permission."\n        }\n    }\n}\n\n// swiftlint:disable type_body_length\n@objc(LocalNotificationsPlugin)\npublic class LocalNotificationsPlugin: CAPPlugin, CAPBridgedPlugin {\n    public let identifier = "LocalNotificationsPlugin"\n    public let jsName = "LocalNotifications"\n    public let pluginMethods: [CAPPluginMethod] = [\n        CAPPluginMethod(name: "schedule", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "update", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "requestPermissions", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "checkPermissions", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "checkExactNotificationSetting", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "changeExactNotificationSetting", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "cancel", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "cancelAll", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "getPending", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "getByIds", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "getAll", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "registerActionTypes", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "areEnabled", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "getDeliveredNotifications", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "removeAllDeliveredNotifications", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "removeDeliveredNotifications", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "removeDeliveredNotificationsById", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "createChannel", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "deleteChannel", returnType: CAPPluginReturnPromise),\n        CAPPluginMethod(name: "listChannels", returnType: CAPPluginReturnPromise)\n    ]\n    private let notificationDelegationHandler = LocalNotificationsHandler()\n\n    /// Reject a call with an OutSystems structured error (`code` + `message`).\n    private func reject(_ call: CAPPluginCall, _ error: LocalNotificationsError, _ underlying: Error? = nil) {\n        call.reject(error.message, error.code, underlying)\n    }\n\n    override public func load() {\n        self.bridge?.notificationRouter.localNotificationHandler = self.notificationDelegationHandler\n        self.notificationDelegationHandler.plugin = self\n        self.shouldStringifyDatesInCalls = false\n    }\n\n    /**\n     * Schedule a notification.\n     *\n     * Requests notification authorization first if it hasn\'t been determined\n     * yet, so scheduling works without an explicit `requestPermissions()` call.\n     */\n    @objc func schedule(_ call: CAPPluginCall) {\n        ensureAuthorization { [weak self] in\n            self?.performSchedule(call, onlyExisting: false)\n        }\n    }\n\n    /**\n     * Update previously scheduled notifications, matched by id. Notifications\n     * that are not currently pending are ignored.\n     */\n    @objc func update(_ call: CAPPluginCall) {\n        ensureAuthorization { [weak self] in\n            self?.performSchedule(call, onlyExisting: true)\n        }\n    }\n\n    /**\n     * Request authorization if the status is still undetermined, then run the\n     * completion regardless of the outcome (mirrors the legacy implicit-request\n     * behavior). `center.add` still enforces the real authorization state.\n     */\n    private func ensureAuthorization(_ completion: @escaping () -> Void) {\n        let center = UNUserNotificationCenter.current()\n        center.getNotificationSettings { settings in\n            if settings.authorizationStatus == .notDetermined {\n                self.notificationDelegationHandler.requestPermissions { _, _ in\n                    completion()\n                }\n            } else {\n                completion()\n            }\n        }\n    }\n\n    private func performSchedule(_ call: CAPPluginCall, onlyExisting: Bool) {\n        guard let notifications = call.getArray("notifications", JSObject.self) else {\n            self.reject(call, .invalidNotificationsArray)\n            return\n        }\n\n        if onlyExisting {\n            UNUserNotificationCenter.current().getPendingNotificationRequests { pending in\n                let pendingIds = Set(pending.map { $0.identifier })\n                let filtered = notifications.filter { notification in\n                    if let id = notification["id"] as? Int {\n                        return pendingIds.contains("\\(id)")\n                    }\n                    return false\n                }\n                self.scheduleNotifications(call, filtered)\n            }\n        } else {\n            self.scheduleNotifications(call, notifications)\n        }\n    }\n\n    private func scheduleNotifications(_ call: CAPPluginCall, _ notifications: [JSObject]) {\n        var ids = [String]()\n\n        for notification in notifications {\n            guard let identifier = notification["id"] as? Int else {\n                self.reject(call, .missingIdentifier)\n                return\n            }\n\n            var content: UNNotificationContent\n            do {\n                content = try makeNotificationContent(notification)\n            } catch {\n                CAPLog.print(error.localizedDescription)\n                self.reject(call, .contentBuildFailed, error)\n                return\n            }\n\n            var trigger: UNNotificationTrigger?\n\n            do {\n                if let schedule = notification["schedule"] as? JSObject {\n                    try trigger = handleScheduledNotification(schedule)\n                }\n            } catch let err as LocalNotificationsError {\n                self.reject(call, err)\n                return\n            } catch {\n                self.reject(call, .triggerBuildFailed, error)\n                return\n            }\n\n            // Schedule the request.\n            let request = UNNotificationRequest(identifier: "\\(identifier)", content: content, trigger: trigger)\n\n            self.notificationDelegationHandler.notificationRequestLookup[request.identifier] = notification\n\n            let center = UNUserNotificationCenter.current()\n            center.add(request) { [weak self] (error: Error?) in\n                #if DEBUG\n                if ProcessInfo.processInfo.environment["COMMANDEICI_QA_DEMO"] == "1", request.identifier == "1701003" {\n                    NotificationCenter.default.post(name: Notification.Name("CommandeIciQaNotificationAddResult"), object: nil, userInfo: ["failed": error != nil])\n                }\n                #endif\n                if let theError = error {\n                    CAPLog.print(theError.localizedDescription)\n                    self?.reject(call, .scheduleFailed, theError)\n                }\n            }\n\n            ids.append(request.identifier)\n        }\n\n        let ret = ids.map({ (id) -> JSObject in\n            return [\n                "id": Int(id) ?? -1\n            ]\n        })\n        call.resolve([\n            "notifications": ret\n        ])\n    }\n\n    /**\n     * Request notification permission\n     */\n    @objc override public func requestPermissions(_ call: CAPPluginCall) {\n        self.notificationDelegationHandler.requestPermissions { granted, error in\n            guard error == nil else {\n                self.reject(call, .permissionRequestFailed, error)\n                return\n            }\n            call.resolve(["display": granted ? "granted" : "denied"])\n        }\n    }\n\n    @objc override public func checkPermissions(_ call: CAPPluginCall) {\n        self.notificationDelegationHandler.checkPermissions { status in\n            let permission: String\n\n            switch status {\n            case .authorized, .ephemeral, .provisional:\n                permission = "granted"\n            case .denied:\n                permission = "denied"\n            case .notDetermined:\n                permission = "prompt"\n            @unknown default:\n                permission = "prompt"\n            }\n\n            call.resolve(["display": permission])\n        }\n    }\n\n    @objc public func checkExactNotificationSetting(_ call: CAPPluginCall) {\n        call.unimplemented()\n    }\n\n    @objc public func changeExactNotificationSetting(_ call: CAPPluginCall) {\n        call.unimplemented()\n    }\n\n    /**\n     * Cancel notifications by id\n     */\n    @objc func cancel(_ call: CAPPluginCall) {\n        guard let notifications = call.getArray("notifications", JSObject.self), notifications.count > 0 else {\n            self.reject(call, .invalidNotificationsArray)\n            return\n        }\n\n        let ids = notifications.map({ (value: JSObject) -> String in\n            if let idString = value["id"] as? String {\n                return idString\n            } else if let idNum = value["id"] as? NSNumber {\n                return idNum.stringValue\n            }\n            return ""\n        })\n\n        UNUserNotificationCenter.current().removePendingNotificationRequests(withIdentifiers: ids)\n        call.resolve()\n    }\n\n    /**\n     * Cancel all pending (scheduled) notifications.\n     */\n    @objc func cancelAll(_ call: CAPPluginCall) {\n        UNUserNotificationCenter.current().removeAllPendingNotificationRequests()\n        call.resolve()\n    }\n\n    /**\n     * Get notifications (pending and/or delivered) matching the supplied ids.\n     */\n    @objc func getByIds(_ call: CAPPluginCall) {\n        guard let idsArray = call.getArray("ids") else {\n            self.reject(call, .missingIds)\n            return\n        }\n        let wantedIds = Set(idsArray.compactMap { value -> String? in\n            if let intValue = value as? Int { return "\\(intValue)" }\n            if let numValue = value as? NSNumber { return numValue.stringValue }\n            if let strValue = value as? String { return strValue }\n            return nil\n        })\n\n        let center = UNUserNotificationCenter.current()\n        center.getPendingNotificationRequests { pending in\n            center.getDeliveredNotifications { delivered in\n                var ret = [JSObject]()\n                for request in pending where wantedIds.contains(request.identifier) {\n                    ret.append(self.notificationDelegationHandler.makeNotificationRequestJSObject(request))\n                }\n                for notification in delivered where wantedIds.contains(notification.request.identifier) {\n                    ret.append(self.notificationDelegationHandler.makeNotificationRequestJSObject(notification.request))\n                }\n                call.resolve(["notifications": ret])\n            }\n        }\n    }\n\n    /**\n     * Get all notifications, optionally filtered by state\n     * (`SCHEDULED` = pending, `TRIGGERED` = delivered).\n     */\n    @objc func getAll(_ call: CAPPluginCall) {\n        let state = call.getString("state")\n        let center = UNUserNotificationCenter.current()\n\n        if state == "SCHEDULED" {\n            center.getPendingNotificationRequests { pending in\n                let ret = pending.map { self.notificationDelegationHandler.makeNotificationRequestJSObject($0) }\n                call.resolve(["notifications": ret])\n            }\n            return\n        }\n\n        if state == "TRIGGERED" {\n            center.getDeliveredNotifications { delivered in\n                let ret = delivered.map { self.notificationDelegationHandler.makeNotificationRequestJSObject($0.request) }\n                call.resolve(["notifications": ret])\n            }\n            return\n        }\n\n        center.getPendingNotificationRequests { pending in\n            center.getDeliveredNotifications { delivered in\n                var ret = pending.map { self.notificationDelegationHandler.makeNotificationRequestJSObject($0) }\n                ret.append(contentsOf: delivered.map { self.notificationDelegationHandler.makeNotificationRequestJSObject($0.request) })\n                call.resolve(["notifications": ret])\n            }\n        }\n    }\n\n    /**\n     * Get all pending notifications.\n     */\n    @objc func getPending(_ call: CAPPluginCall) {\n        UNUserNotificationCenter.current().getPendingNotificationRequests(completionHandler: { (notifications) in\n            CAPLog.print("num of pending notifications \\(notifications.count)")\n            CAPLog.print(notifications)\n\n            let ret = notifications.compactMap({ [weak self] (notification) -> JSObject? in\n                return self?.notificationDelegationHandler.makePendingNotificationRequestJSObject(notification)\n            })\n\n            call.resolve([\n                "notifications": ret\n            ])\n        })\n    }\n\n    /**\n     * Register allowed action types that a notification may present.\n     */\n    @objc func registerActionTypes(_ call: CAPPluginCall) {\n        guard let types = call.getArray("types", JSObject.self) else {\n            return\n        }\n\n        makeActionTypes(types)\n\n        call.resolve()\n    }\n\n    /**\n     * Check if Local Notifications are authorized and enabled\n     */\n    @objc func areEnabled(_ call: CAPPluginCall) {\n        let center = UNUserNotificationCenter.current()\n        center.getNotificationSettings { (settings) in\n            let authorized = settings.authorizationStatus == UNAuthorizationStatus.authorized\n            let enabled = settings.notificationCenterSetting == UNNotificationSetting.enabled\n            call.resolve([\n                "value": enabled && authorized\n            ])\n        }\n    }\n\n    /**\n     * Build the content for a notification.\n     */\n    func makeNotificationContent(_ notification: JSObject) throws -> UNNotificationContent {\n        guard let title = notification["title"] as? String else {\n            throw LocalNotificationError.contentNoTitle\n        }\n        guard let body = notification["body"] as? String else {\n            throw LocalNotificationError.contentNoBody\n        }\n\n        let schedule = notification["schedule"] as? JSObject ?? [:]\n        let content = UNMutableNotificationContent()\n        content.title = NSString.localizedUserNotificationString(forKey: title, arguments: nil)\n        content.body = NSString.localizedUserNotificationString(forKey: body,\n                                                                arguments: nil)\n\n        // `extra` is documented as `any`, not just an object — preserve whatever\n        // raw value was provided (string, number, array, dictionary) rather than\n        // forcing a dictionary cast. And omit it entirely when not provided at\n        // all, rather than defaulting to an empty dictionary.\n        var userInfo: [String: Any] = [\n            "cap_schedule": schedule\n        ]\n        if let extra = notification["extra"] {\n            userInfo["cap_extra"] = extra\n        }\n        content.userInfo = userInfo\n\n        if let actionTypeId = notification["actionTypeId"] as? String {\n            content.categoryIdentifier = actionTypeId\n        }\n\n        if let threadIdentifier = notification["threadIdentifier"] as? String {\n            content.threadIdentifier = threadIdentifier\n        }\n\n        if let summaryArgument = notification["summaryArgument"] as? String {\n            if #unavailable(iOS 15.0) {\n                content.summaryArgument = summaryArgument\n            }\n        }\n\n        if let relevanceScore = notification["relevanceScore"] as? Double {\n            content.relevanceScore = relevanceScore\n        }\n\n        if let interruptionLevelString = notification["interruptionLevel"] as? String {\n            switch interruptionLevelString {\n            case "active":\n                content.interruptionLevel = .active\n            case "critical":\n                content.interruptionLevel = .critical\n            case "passive":\n                content.interruptionLevel = .passive\n            case "timeSensitive":\n                content.interruptionLevel = .timeSensitive\n            default:\n                break\n            }\n        }\n\n        if let sound = notification["sound"] as? String, !sound.isEmpty {\n            content.sound = resolveSound(sound)\n        }\n\n        if let badge = notification["badge"] as? Int {\n            content.badge = NSNumber(value: badge)\n        }\n\n        if let attachments = notification["attachments"] as? [JSObject] {\n            content.attachments = try makeAttachments(attachments)\n        }\n\n        return content\n    }\n\n    /// Resolve a `sound` value to a `UNNotificationSound`. OutSystems bundles the\n    /// audio file into the app\'s web assets (`www/` for Cordova, `public/` for\n    /// Capacitor), so a bare filename is searched there — matching the exact name\n    /// or the hashed `<base>__<hash>.<ext>` variant the build may emit — and the\n    /// folder-qualified name is passed to `UNNotificationSound` (which is what it\n    /// needs). Falls back to the value as a bundle-root sound name, then default.\n    private func resolveSound(_ path: String) -> UNNotificationSound {\n        let ext = (path as NSString).pathExtension\n        let base = (path as NSString).deletingPathExtension\n        if !ext.isEmpty, let resourcePath = Bundle.main.resourcePath {\n            let fileManager = FileManager.default\n            for folder in ["www", "public"] {\n                let folderPath = (resourcePath as NSString).appendingPathComponent(folder)\n                guard let files = try? fileManager.contentsOfDirectory(atPath: folderPath) else { continue }\n                let exact = "\\(base).\\(ext)"\n                if files.contains(exact) {\n                    return UNNotificationSound(named: UNNotificationSoundName("\\(folder)/\\(exact)"))\n                }\n                let pattern = "^\\(NSRegularExpression.escapedPattern(for: base))__.+\\\\.\\(NSRegularExpression.escapedPattern(for: ext))$"\n                if let match = files.first(where: { $0.range(of: pattern, options: [.regularExpression, .caseInsensitive]) != nil }) {\n                    return UNNotificationSound(named: UNNotificationSoundName("\\(folder)/\\(match)"))\n                }\n            }\n        }\n        return UNNotificationSound(named: UNNotificationSoundName(path))\n    }\n\n    /**\n     * Build a notification trigger, such as triggering each N seconds, or\n     * on a certain date "shape" (such as every first of the month)\n     */\n    func handleScheduledNotification(_ schedule: JSObject) throws -> UNNotificationTrigger? {\n        var at: Date?\n        if let scheduleDate = schedule["at"] as? NSDate {\n            at = scheduleDate as Date\n        }\n        let every = schedule["every"] as? String\n        let count = schedule["count"] as? Int ?? 1\n        let on = schedule["on"] as? JSObject\n        let repeats = schedule["repeats"] as? Bool ?? false\n\n        // If there\'s a specific date for this notificiation\n        if let at = at {\n            let dateInfo = Calendar.current.dateComponents(in: TimeZone.current, from: at)\n\n            if dateInfo.date! < Date() {\n                // Already in the past — deliver immediately (a nil trigger delivers\n                // right away) instead of rejecting. For `repeats`, the series isn\'t\n                // re-registered afterward: the only interval this feature has is the\n                // gap between call time and `at`, and once `at` is stale that gap is\n                // gone — there\'s no way to recover what cadence was intended.\n                return nil\n            }\n\n            let dateInterval = DateInterval(start: Date(), end: dateInfo.date!)\n\n            // Notifications that repeat have to be at least a minute between each other\n            if repeats && dateInterval.duration < 60 {\n                throw LocalNotificationError.triggerRepeatIntervalTooShort\n            }\n\n            return UNTimeIntervalNotificationTrigger(timeInterval: dateInterval.duration, repeats: repeats)\n        }\n\n        // If this notification should repeat every count of day/month/week/etc. or on a certain\n        // matching set of date components\n        if let on = on {\n            let dateComponents = getDateComponents(on)\n            return UNCalendarNotificationTrigger(dateMatching: dateComponents, repeats: true)\n        }\n\n        if let every = every {\n            if let repeatDateInterval = getRepeatDateInterval(every, count) {\n                // A repeating UNTimeIntervalNotificationTrigger requires an interval of at\n                // least 60s (a shorter one is an uncaught exception, not a catchable error).\n                // `every: "second"` (or a low count) resolves under that, so clamp up to the\n                // platform minimum instead of crashing.\n                let interval = max(repeatDateInterval.duration, 60)\n                return UNTimeIntervalNotificationTrigger(timeInterval: interval, repeats: true)\n            }\n        }\n\n        return nil\n    }\n\n    /**\n     * Given our schedule format, return a DateComponents object\n     * that only contains the components passed in.\n     */\n    func getDateComponents(_ at: JSObject) -> DateComponents {\n        // var dateInfo = Calendar.current.dateComponents(in: TimeZone.current, from: Date())\n        // dateInfo.calendar = Calendar.current\n        var dateInfo = DateComponents()\n\n        if let year = at["year"] as? Int {\n            dateInfo.year = year\n        }\n        if let month = at["month"] as? Int {\n            dateInfo.month = month\n        }\n        if let day = at["day"] as? Int {\n            dateInfo.day = day\n        }\n        if let hour = at["hour"] as? Int {\n            dateInfo.hour = hour\n        }\n        if let minute = at["minute"] as? Int {\n            dateInfo.minute = minute\n        }\n        if let second = at["second"] as? Int {\n            dateInfo.second = second\n        }\n        if let weekday = at["weekday"] as? Int {\n            dateInfo.weekday = weekday\n        }\n        return dateInfo\n    }\n\n    /**\n     * Compute the difference between the string representation of a date\n     * interval and today. For example, if every is "month", then we\n     * return the interval between today and a month from today.\n     */\n    func getRepeatDateInterval(_ every: String, _ count: Int) -> DateInterval? {\n        let cal = Calendar.current\n        let now = Date()\n        switch every {\n        case "year":\n            let newDate = cal.date(byAdding: .year, value: count, to: now)!\n            return DateInterval(start: now, end: newDate)\n        case "month":\n            let newDate = cal.date(byAdding: .month, value: count, to: now)!\n            return DateInterval(start: now, end: newDate)\n        case "two-weeks":\n            let newDate = cal.date(byAdding: .weekOfYear, value: 2 * count, to: now)!\n            return DateInterval(start: now, end: newDate)\n        case "week":\n            let newDate = cal.date(byAdding: .weekOfYear, value: count, to: now)!\n            return DateInterval(start: now, end: newDate)\n        case "day":\n            let newDate = cal.date(byAdding: .day, value: count, to: now)!\n            return DateInterval(start: now, end: newDate)\n        case "hour":\n            let newDate = cal.date(byAdding: .hour, value: count, to: now)!\n            return DateInterval(start: now, end: newDate)\n        case "minute":\n            let newDate = cal.date(byAdding: .minute, value: count, to: now)!\n            return DateInterval(start: now, end: newDate)\n        case "second":\n            let newDate = cal.date(byAdding: .second, value: count, to: now)!\n            return DateInterval(start: now, end: newDate)\n        default:\n            return nil\n        }\n    }\n\n    /**\n     * Make required UNNotificationCategory entries for action types\n     */\n    func makeActionTypes(_ actionTypes: [JSObject]) {\n        var createdCategories = [UNNotificationCategory]()\n\n        let generalCategory = UNNotificationCategory(identifier: "GENERAL",\n                                                     actions: [],\n                                                     intentIdentifiers: [],\n                                                     options: .customDismissAction)\n\n        createdCategories.append(generalCategory)\n        for type in actionTypes {\n            guard let id = type["id"] as? String else {\n                CAPLog.print("⚡️ ", self.pluginId, "-", "Action type must have an id field")\n                continue\n            }\n            let hiddenBodyPlaceholder = type["iosHiddenPreviewsBodyPlaceholder"] as? String ?? ""\n            let actions = type["actions"] as? [JSObject] ?? []\n\n            let newActions = makeActions(actions)\n\n            // Create the custom actions for the TIMER_EXPIRED category.\n            var newCategory: UNNotificationCategory?\n\n            newCategory = UNNotificationCategory(identifier: id,\n                                                 actions: newActions,\n                                                 intentIdentifiers: [],\n                                                 hiddenPreviewsBodyPlaceholder: hiddenBodyPlaceholder,\n                                                 options: makeCategoryOptions(type))\n\n            createdCategories.append(newCategory!)\n        }\n\n        let center = UNUserNotificationCenter.current()\n        center.setNotificationCategories(Set(createdCategories))\n    }\n\n    /**\n     * Build the required UNNotificationAction objects for each action type registered.\n     */\n    func makeActions(_ actions: [JSObject]) -> [UNNotificationAction] {\n        var createdActions = [UNNotificationAction]()\n\n        for action in actions {\n            guard let id = action["id"] as? String else {\n                CAPLog.print("⚡️ ", self.pluginId, "-", "Action must have an id field")\n                continue\n            }\n            let title = action["title"] as? String ?? ""\n            let input = action["input"] as? Bool ?? false\n\n            var newAction: UNNotificationAction\n            if input {\n                let inputButtonTitle = action["inputButtonTitle"] as? String\n                let inputPlaceholder = action["inputPlaceholder"] as? String ?? ""\n\n                if inputButtonTitle != nil {\n                    newAction = UNTextInputNotificationAction(identifier: id,\n                                                              title: title,\n                                                              options: makeActionOptions(action),\n                                                              textInputButtonTitle: inputButtonTitle!,\n                                                              textInputPlaceholder: inputPlaceholder)\n                } else {\n                    newAction = UNTextInputNotificationAction(identifier: id, title: title, options: makeActionOptions(action))\n                }\n            } else {\n                // Create the custom actions for the TIMER_EXPIRED category.\n                newAction = UNNotificationAction(identifier: id,\n                                                 title: title,\n                                                 options: makeActionOptions(action))\n            }\n            createdActions.append(newAction)\n        }\n\n        return createdActions\n    }\n\n    /**\n     * Make options for UNNotificationActions\n     */\n    func makeActionOptions(_ action: JSObject) -> UNNotificationActionOptions {\n        let foreground = action["foreground"] as? Bool ?? false\n        let destructive = action["destructive"] as? Bool ?? false\n        let requiresAuthentication = action["requiresAuthentication"] as? Bool ?? false\n\n        if foreground {\n            return .foreground\n        }\n        if destructive {\n            return .destructive\n        }\n        if requiresAuthentication {\n            return .authenticationRequired\n        }\n        return UNNotificationActionOptions(rawValue: 0)\n    }\n\n    /**\n     * Make options for UNNotificationCategoryActions\n     */\n    func makeCategoryOptions(_ type: JSObject) -> UNNotificationCategoryOptions {\n        let customDismiss = type["iosCustomDismissAction"] as? Bool ?? false\n        let carPlay = type["iosAllowInCarPlay"] as? Bool ?? false\n        let hiddenPreviewsShowTitle = type["iosHiddenPreviewsShowTitle"] as? Bool ?? false\n        let hiddenPreviewsShowSubtitle = type["iosHiddenPreviewsShowSubtitle"] as? Bool ?? false\n\n        if customDismiss {\n            return .customDismissAction\n        }\n        if carPlay {\n            return .allowInCarPlay\n        }\n\n        if hiddenPreviewsShowTitle {\n            return .hiddenPreviewsShowTitle\n        }\n        if hiddenPreviewsShowSubtitle {\n            return .hiddenPreviewsShowSubtitle\n        }\n\n        return UNNotificationCategoryOptions(rawValue: 0)\n    }\n\n    /**\n     * Build the UNNotificationAttachment object for each attachment supplied.\n     */\n    func makeAttachments(_ attachments: [JSObject]) throws -> [UNNotificationAttachment] {\n        var createdAttachments = [UNNotificationAttachment]()\n\n        for attachment in attachments {\n            guard let id = attachment["id"] as? String else {\n                throw LocalNotificationError.attachmentNoId\n            }\n            guard let url = attachment["url"] as? String else {\n                throw LocalNotificationError.attachmentNoUrl\n            }\n            guard let urlObject = makeAttachmentUrl(url) else {\n                throw LocalNotificationError.attachmentFileNotFound(path: url)\n            }\n\n            let options = attachment["options"] as? JSObject ?? [:]\n\n            do {\n                let newAttachment = try UNNotificationAttachment(identifier: id, url: urlObject, options: makeAttachmentOptions(options))\n                createdAttachments.append(newAttachment)\n            } catch {\n                throw LocalNotificationError.attachmentUnableToCreate(error.localizedDescription)\n            }\n        }\n\n        return createdAttachments\n    }\n\n    /**\n     * Get the internal URL for the attachment URL\n     */\n    func makeAttachmentUrl(_ path: String) -> URL? {\n        guard let webURL = URL(string: path) else {\n            return nil\n        }\n\n        return bridge?.localURL(fromWebURL: webURL)\n    }\n\n    /**\n     * Build the options for the attachment, if any. (For example: the clipping rectangle to use\n     * for image attachments)\n     */\n    func makeAttachmentOptions(_ options: JSObject) -> JSObject {\n        var opts: JSObject = [:]\n\n        if let iosUNNotificationAttachmentOptionsTypeHintKey = options["iosUNNotificationAttachmentOptionsTypeHintKey"] as? String {\n            opts[UNNotificationAttachmentOptionsTypeHintKey] = iosUNNotificationAttachmentOptionsTypeHintKey\n        }\n        if let iosUNNotificationAttachmentOptionsThumbnailHiddenKey = options["iosUNNotificationAttachmentOptionsThumbnailHiddenKey"] as? String {\n            opts[UNNotificationAttachmentOptionsThumbnailHiddenKey] = iosUNNotificationAttachmentOptionsThumbnailHiddenKey\n        }\n        if let iosUNNotificationAttachmentOptionsThumbnailClippingRectKey = options["iosUNNotificationAttachmentOptionsThumbnailClippingRectKey"] as? String {\n            opts[UNNotificationAttachmentOptionsThumbnailClippingRectKey] = iosUNNotificationAttachmentOptionsThumbnailClippingRectKey\n        }\n        if let iosUNNotificationAttachmentOptionsThumbnailTimeKey = options["iosUNNotificationAttachmentOptionsThumbnailTimeKey"] as? String {\n            opts[UNNotificationAttachmentOptionsThumbnailTimeKey] = iosUNNotificationAttachmentOptionsThumbnailTimeKey\n        }\n        return opts\n    }\n\n    /**\n     * Get notifications in Notification Center\n     */\n    @objc func getDeliveredNotifications(_ call: CAPPluginCall) {\n        UNUserNotificationCenter.current().getDeliveredNotifications(completionHandler: { (notifications) in\n            let ret = notifications.map({ (notification) -> [String: Any] in\n                return self.notificationDelegationHandler.makeNotificationRequestJSObject(notification.request)\n            })\n            call.resolve([\n                "notifications": ret\n            ])\n        })\n    }\n\n    /**\n     * Remove specified notifications from Notification Center\n     */\n    @objc func removeDeliveredNotifications(_ call: CAPPluginCall) {\n        guard let notifications = call.getArray("notifications", JSObject.self) else {\n            self.reject(call, .invalidRemoveList)\n            return\n        }\n\n        let ids = notifications.map { "\\($0["id"] ?? "")" }\n        UNUserNotificationCenter.current().removeDeliveredNotifications(withIdentifiers: ids)\n        call.resolve()\n    }\n\n    /**\n     * Remove delivered notifications from Notification Center by id.\n     */\n    @objc func removeDeliveredNotificationsById(_ call: CAPPluginCall) {\n        guard let idsArray = call.getArray("ids") else {\n            self.reject(call, .missingIds)\n            return\n        }\n        let ids = idsArray.compactMap { value -> String? in\n            if let intValue = value as? Int { return "\\(intValue)" }\n            if let numValue = value as? NSNumber { return numValue.stringValue }\n            if let strValue = value as? String { return strValue }\n            return nil\n        }\n        UNUserNotificationCenter.current().removeDeliveredNotifications(withIdentifiers: ids)\n        call.resolve()\n    }\n\n    /**\n     * Remove all notifications from Notification Center\n     */\n    @objc func removeAllDeliveredNotifications(_ call: CAPPluginCall) {\n        UNUserNotificationCenter.current().removeAllDeliveredNotifications()\n        if #available(iOS 16.0, *) {\n            UNUserNotificationCenter.current().setBadgeCount(0)\n        } else {\n            DispatchQueue.main.async {\n                UIApplication.shared.applicationIconBadgeNumber = 0\n            }\n        }\n        call.resolve()\n    }\n\n    @objc func createChannel(_ call: CAPPluginCall) {\n        call.unimplemented()\n    }\n\n    @objc func deleteChannel(_ call: CAPPluginCall) {\n        call.unimplemented()\n    }\n\n    @objc func listChannels(_ call: CAPPluginCall) {\n        call.unimplemented()\n    }\n}\n')
